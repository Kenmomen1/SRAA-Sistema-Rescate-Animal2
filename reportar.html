<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRAA - Reportar Rescate</title>
</head>
<body>

    <header>
        <img src="assets/img/logo.png" alt="Logo del Sistema SRAA" width="100">
        <h1>Sistema de Control de Rescate y Adopción Animal (SRAA)</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar Rescate</a></li>
            <li><a href="rescates.html">Ver Rescates</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulario de Ingreso de Nuevo Rescate</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Datos del Animal y Ubicación</legend>

                    <p>
                        <label for="titulo">Título del caso / Nombre provisional:</label><br>
                        <input type="text" id="titulo" name="titulo" required placeholder="Ej. Perro herido en Av. Central">
                    </p>

                    <p>
                        <label for="categoria">Categoría (Especie):</label><br>
                        <select id="categoria" name="categoria" required>
                            <option value="">-- Seleccione una especie --</option>
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                            <option value="fauna_silvestre">Fauna Silvestre</option>
                        </select>
                    </p>

                    <p>
                        <label>Nivel de Urgencia Médica:</label><br>
                        <input type="radio" id="urgencia_alta" name="urgencia" value="Alta" required>
                        <label for="urgencia_alta">Alta</label><br>

                        <input type="radio" id="urgencia_media" name="urgencia" value="Media">
                        <label for="urgencia_media">Media</label><br>

                        <input type="radio" id="urgencia_baja" name="urgencia" value="Baja">
                        <label for="urgencia_baja">Baja</label>
                    </p>

                    <p>
                        <label for="descripcion">Descripción detallada del hallazgo:</label><br>
                        <textarea id="descripcion" name="descripcion" rows="5" cols="40" required placeholder="Describa el estado de salud, lesiones visibles y ubicación exacta..."></textarea>
                    </p>

                    <p>
                        <button type="submit">Guardar y Registrar Caso</button>
                        <button type="reset">Limpiar Formulario</button>
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Universidad Técnica de Manabí | Desarrollado por Kenny Moreira</p>
        <p>Contacto: soporte@sraa.org</p>
    </footer>

</body>
</html>
